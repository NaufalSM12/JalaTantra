---
- name: Restart an approved service
  hosts: managed
  become: true
  gather_facts: false
  tasks:
    - name: Validate service allowlist
      ansible.builtin.assert:
        that:
          - service_unit in ['named', 'mariadb', 'ssh', 'prometheus', 'grafana-server', 'prometheus-node-exporter']
    - name: Restart approved service
      ansible.builtin.service:
        name: "{{ service_unit }}"
        state: restarted
    - name: Verify approved service state
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ service_unit }}"]
      changed_when: false
