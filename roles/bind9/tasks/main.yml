---
- name: Install Bind9 packages
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Bind9 options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkconf %s
  notify: Restart Bind9

- name: Configure authoritative zone
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkconf %s
  notify: Restart Bind9

- name: Install DNS zone file
  ansible.builtin.template:
    src: db.zone.j2
    dest: "/etc/bind/db.{{ project_domain }}"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkzone {{ project_domain }} %s"
  notify: Restart Bind9

- name: Ensure Bind9 is enabled and running
  ansible.builtin.service:
    name: bind9
    state: started
    enabled: true
