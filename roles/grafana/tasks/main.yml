---
- name: Validate Grafana admin password
  ansible.builtin.assert:
    that:
      - grafana_admin_password != 'CHANGE_ME_WITH_ANSIBLE_VAULT'
    fail_msg: Set grafana_admin_password in Ansible Vault before deploying Grafana.

- name: Install Grafana repository prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download and dearmor Grafana signing key
  ansible.builtin.shell: |
    set -o pipefail
    wget -q -O - {{ grafana_apt_key_url }} | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  args:
    creates: /etc/apt/keyrings/grafana.gpg
    executable: /bin/bash

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "{{ grafana_apt_repository }}"
    filename: grafana
    state: present
    update_cache: true

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present

- name: Configure Grafana listener
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Configure Prometheus datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Create Grafana dashboard directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards/kelompok8
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Configure Grafana dashboard provider
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: /etc/grafana/provisioning/dashboards/kelompok8.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Install infrastructure overview dashboard
  ansible.builtin.template:
    src: kelompok8-dashboard.json
    dest: /var/lib/grafana/dashboards/kelompok8/overview.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Install persistent demonstration dashboard
  ansible.builtin.copy:
    src: kelompok8-demo.json
    dest: /var/lib/grafana/dashboards/kelompok8/demo.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Ensure Grafana is enabled and running
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true

- name: Set Grafana admin password on first deployment
  ansible.builtin.command:
    argv:
      - grafana
      - cli
      - admin
      - reset-admin-password
      - --password-from-stdin
    stdin: "{{ grafana_admin_password }}"
    creates: /var/lib/grafana/.kelompok8-admin-password-set
  register: grafana_password_reset
  no_log: true

- name: Record Grafana admin password initialization
  ansible.builtin.file:
    path: /var/lib/grafana/.kelompok8-admin-password-set
    state: touch
    owner: grafana
    group: grafana
    mode: "0600"
  when: grafana_password_reset is changed
  no_log: true

- name: Apply Grafana changes before readiness verification
  ansible.builtin.meta: flush_handlers

- name: Verify Grafana API and database readiness
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if grafana_listen_address == '0.0.0.0' else grafana_listen_address }}:{{ grafana_http_port }}/api/health"
    return_content: true
  register: grafana_health
  until:
    - grafana_health.status | default(0) == 200
    - (grafana_health.json | default({})).get('database') == 'ok'
  retries: 30
  delay: 2
  when: not ansible_check_mode
