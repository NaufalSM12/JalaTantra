---
# Set inventory groups on your hosts to choose where each service is installed.
# Keep secrets out of this file; use Ansible Vault for passwords.
project_domain: kelompok8.test
project_dns_server_ip: 127.0.0.1
project_timezone: Asia/Jakarta
bind9_zone_serial: 2026111901

bind9_listen_ipv4:
  - 127.0.0.1
bind9_allow_query:
  - 127.0.0.1
bind9_zone_records:
  - name: ns1
    address: 127.0.0.1
  - name: monitor
    address: 127.0.0.1
  - name: grafana
    address: 127.0.0.1
  - name: db
    address: 127.0.0.1

mariadb_bind_address: 127.0.0.1
mariadb_database_name: kelompok8
mariadb_app_user: kelompok8_app
mariadb_app_password: CHANGE_ME_WITH_ANSIBLE_VAULT
mariadb_root_password: CHANGE_ME_WITH_ANSIBLE_VAULT
mariadb_login_password: ""

prometheus_listen_address: 127.0.0.1:9090
prometheus_self_target: 127.0.0.1:9090
prometheus_scrape_interval: 15s
prometheus_node_exporter_targets:
  - 127.0.0.1:9100

node_exporter_listen_address: 127.0.0.1:9100
grafana_listen_address: 127.0.0.1
grafana_http_port: 3000
grafana_admin_user: admin
grafana_admin_password: CHANGE_ME_WITH_ANSIBLE_VAULT

k8_demo_enabled: true
